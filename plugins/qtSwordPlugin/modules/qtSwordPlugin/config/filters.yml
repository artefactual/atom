# Prepend qtSwordPluginHttpAuthFilter to the chain
httpAuthFilter:
  class: qtSwordPluginHttpAuthFilter

# Inherit filters, cascade mechanism
history: ~
rendering: ~
security: ~
settings: ~
culture_header: ~
QubitLimitIp: ~
QubitSslRequirement: ~
QubitMeta: ~
QubitLimitResults: ~
QubitTransaction: ~

QubitCSP:
  enable: false

# Bypass the login requirement filter for sword deposits
QubitRequireLogin:
  enabled: false

cache: ~
execution: ~

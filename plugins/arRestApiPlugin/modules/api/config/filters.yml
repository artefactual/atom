# Inherit filters, cascade mechanism
history: ~
rendering: ~
security: ~
settings: ~
culture_header: ~
QubitLimitIp: ~
QubitSslRequirement: ~

# Bypass the login requirement filter for REST API requests
QubitRequireLogin:
  enabled: false

QubitMeta: ~
QubitLimitResults: ~

# Add arRestApiPluginFilter to the chain
restApiFilter:
  class: arRestApiPluginFilter

QubitTransaction: ~

QubitCSP:
  enable: false

cache: ~
execution: ~

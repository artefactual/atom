name: Container image
on:
  pull_request:
  push:
    branches:
    - qa/**
    - stable/**
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    name: Production image
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build production image
      run: |
        docker build \
          --build-arg VCS_REF="${GITHUB_SHA}" \
          --target production \
          --tag atom:production \
          .
    - name: Verify production image
      run: docker/verify-image.sh atom:production "${GITHUB_SHA}"
    - name: Start runtime dependencies
      env:
        COMPOSE_PROJECT_NAME: atom-production
      run: |
        docker compose \
          -f docker/docker-compose.test.yml \
          up -d percona elasticsearch memcached gearmand
    - name: Wait for runtime dependencies
      run: |
        for attempt in {1..60}; do
          if docker run --rm \
            --network atom-production_default \
            --env-file docker/etc/environment \
            --entrypoint php \
            atom:production \
            docker/healthcheck.php ready
          then
            exit 0
          fi

          sleep 2
        done

        exit 1
    - name: Install the production database
      run: |
        docker run --rm \
          --network atom-production_default \
          --env-file docker/etc/environment \
          --env ATOM_DEVELOPMENT_MODE=off \
          --env NODE_ENV=production \
          atom:production \
          php symfony tools:install \
          --database-host=percona \
          --database-port=3306 \
          --database-name=atom \
          --database-user=atom \
          --database-password=atom_12345 \
          --search-host=elasticsearch \
          --search-port=9200 \
          --search-index=atom \
          --demo \
          --no-confirmation
    - name: Verify production runtime
      run: |
        docker/verify-runtime.sh \
          atom:production \
          atom-production_default
    - name: Create upgrade fixture
      env:
        COMPOSE_PROJECT_NAME: atom-production
        ATOM_REHEARSAL_COMPOSE_FILE: docker/docker-compose.test.yml
      run: |
        docker/create-upgrade-fixture.sh \
          "${RUNNER_TEMP}/atom-v193.sql"
    - name: Rehearse production upgrade
      env:
        COMPOSE_PROJECT_NAME: atom-production
        ATOM_REHEARSAL_COMPOSE_FILE: docker/docker-compose.test.yml
        ATOM_REHEARSAL_NETWORK: atom-production_default
      run: |
        docker/rehearse-upgrade.sh \
          "${RUNNER_TEMP}/atom-v193.sql" \
          atom:production
    - name: Print runtime dependency logs
      if: failure()
      env:
        COMPOSE_PROJECT_NAME: atom-production
      run: |
        docker compose \
          -f docker/docker-compose.test.yml \
          logs
    - name: Stop runtime dependencies
      if: always()
      env:
        COMPOSE_PROJECT_NAME: atom-production
      run: |
        docker compose \
          -f docker/docker-compose.test.yml \
          down --volumes

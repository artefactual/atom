name: Syntax checks
on:
  pull_request:
  push:
    branches:
    - qa/**
    - stable/**
permissions:
  contents: read
jobs:
  php-cs-fixer:
    runs-on: ubuntu-24.04
    name: PHP CS Fixer
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup PHP 8.3
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        coverage: none
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: syntax-checks-${{ hashFiles('composer.lock') }}
    - name: Install dependencies
      run: composer install
    - name: Run php-cs-fixer
      run: composer php-cs-fixer -- fix --dry-run -v
  prettier:
    runs-on: ubuntu-24.04
    name: Prettier
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run Prettier
      run: npm run check-format
